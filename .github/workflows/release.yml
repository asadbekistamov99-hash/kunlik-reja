name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v1.0.0)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/jarvis-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "JARVIS_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_ALIAS=${KEY_ALIAS:-jarvis}" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the project release key." >> "$GITHUB_ENV"
          else
            # No key configured: sign with a one-off key so the artifacts are installable.
            # Configure the JARVIS_* secrets (see docs/RELEASE.md) before shipping updates.
            PW="$(openssl rand -hex 24)"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias jarvis \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PW" -keypass "$PW" \
              -dname "CN=Jarvis Ultra, O=Kunlik Reja, C=UZ"
            echo "::add-mask::$PW"
            echo "JARVIS_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_ALIAS=jarvis" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with a one-off CI key (no JARVIS_KEYSTORE_BASE64 secret configured). Uninstall before installing a build signed with the permanent key." >> "$GITHUB_ENV"
          fi
          echo "JARVIS_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build signed APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signatures and collect artifacts
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JarvisUltra-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/JarvisUltra-${RELEASE_TAG}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${RELEASE_TAG}.txt"
          "$BT/apksigner" verify --verbose "dist/JarvisUltra-${RELEASE_TAG}.apk"
          jarsigner -verify "dist/JarvisUltra-${RELEASE_TAG}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cp CHANGELOG.md README.md docs/INSTALL.md dist/
          {
            echo "## Jarvis Ultra ${RELEASE_TAG}"
            echo
            echo "${SIGNING_NOTE}"
            echo
            sed -n '/^## \[1.0.0\]/,/^## \[/p' CHANGELOG.md | sed '$d' | tail -n +2
            echo
            echo "Installation guide: see INSTALL.md attached below."
          } > dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Jarvis Ultra v1.0
          body_path: dist/RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/JarvisUltra-*.apk
            dist/JarvisUltra-*.aab
            dist/mapping-*.txt
            dist/SHA256SUMS.txt
            dist/CHANGELOG.md
            dist/README.md
            dist/INSTALL.md
