name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit/UI tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build debug + release (R8)
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Unit, integration and Robolectric UI tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Android lint
        run: ./gradlew :app:lintDebug 2>&1 | tee lint.log; exit ${PIPESTATUS[0]}
      - name: Failure summary
        if: failure()
        run: |
          for f in build.log test.log lint.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E "^e: |^w: .*(deprecated|unused)? *$|FAILED|Error:|error:|Exception|expected:|at com\.example" "$f" | grep -v "^w: " | head -150
          done
          find app/build/reports/lint-results-debug.txt -exec cat {} \; 2>/dev/null | head -100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-ci-outputs
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/previews/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  device-tests:
    name: Instrumented tests (API ${{ matrix.api }})
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android 12, 13, 14, 15
        api: [31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate wake-word audio fixtures (espeak-ng)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          out=app/src/androidTest/assets/audio; mkdir -p "$out"
          gen() { espeak-ng -v "$2" -s "$3" -w /tmp/raw.wav "$4" && ffmpeg -loglevel error -y -i /tmp/raw.wav -ar 16000 -ac 1 -sample_fmt s16 -map_metadata -1 -fflags +bitexact -flags:a +bitexact "$out/$1.wav"; }
          for v in en-us en-gb en-us+m3 en-us+f3; do
            for sp in 130 160; do
              tag="${v//+/_}_$sp"
              gen "heyjarvis_$tag" "$v" "$sp" "hey jarvis"
              gen "jarvis_$tag" "$v" "$sp" "jarvis"
            done
          done
          gen neg_hello en-us 150 "hello world"
          gen neg_morning en-us 150 "good morning, how are you"
          gen neg_uz en-us 150 "ertaga soat to'qqizda uchrashuv"
          gen neg_service en-us 150 "customer service"
          ls -la "$out"
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
