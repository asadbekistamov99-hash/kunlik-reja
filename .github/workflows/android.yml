name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit/UI tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build debug + release (R8)
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Unit, integration and Robolectric UI tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-ci-outputs
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/previews/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  device-tests:
    name: Instrumented tests (API ${{ matrix.api }})
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android 12, 13, 14, 15
        api: [31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
