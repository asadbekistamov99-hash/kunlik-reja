name: Build Jarvis APK

on:
  push:
    branches: [main, work, codex/jarvis-1.4.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run unit and integration tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ultra-1.4.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
